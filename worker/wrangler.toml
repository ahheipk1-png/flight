name = "smartflighter-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Comma-separated list of origins allowed to call this proxy. Add your
# *.pages.dev origin (and any custom domain) after the first Pages deploy,
# then `npx wrangler deploy` again.
[vars]
ALLOWED_ORIGINS = "http://localhost:3000"
